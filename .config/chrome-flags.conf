--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--ozone-platform=wayland
--ozone-platform-hint=auto
--enable-wayland-ime
--enable-features=WaylandWindowDecorations,WaylandTextInputV3,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,CanvasOopRasterization
--disable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE,SkiaGraphite
